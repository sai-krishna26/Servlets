<h3>Regester your vehicle and avoid traffic penalties</h3>
<br>
<form action="regester" method="post">
    <div class="form group">
        <label for="vehicleno" class="form-label"> Vehicle Number</label>
        <input type="text" id="vehicleno" class="form-control" placeholder="KA01AB1234"  name="vehicleno" required>

        <label for="ownername" class="form-label">Owner Name</label>
        <input type="text" class="form-control" id="ownername"  name="ownername">

        <label for="vehicletype" class="form-label">Vehicle Type</label>
        <select class="form-select" id="vehicletype" name="vehicletype">
            <option value="">Select Vehicle Type</option>
            <option value="2 Wheeler">2 Wheeler</option>
            <option value="4 Wheeler">4 Wheeler</option>
            <option value="6 Wheeler">6 Wheeler</option>
            <option value="6+n Wheeler">6+n Wheeler</option>
        </select>

        <label for="regdate" class="form-label">Registration Date</label>
        <input type="date" class="form-control" id="regdate"  name="regdate">

        <label for="insurance" class="form-label">Insurance Valid Till</label>
        <input type="date" class="form-control" id="insurance"  name="insurance">

        <label for="fueltype" class="form-label">Fuel Type</label>
        <select class="form-select" id="fueltype" name="fueltype">
            <option value="">Select Fuel Type</option>
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="CNG">CNG</option>
            <option value="Electric">Electric</option>
            <option value="Hybrid(Petrol/CNG)">Hybrid(Petrol/CNG)</option>
            <option value="Hybrid(Electric/Petrol)">Hybrid(Electric/Petrol)</option>
        </select>
        <br>

        <button type="submit" class="btn btn-primary">Submit</button>

    </div>

</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
