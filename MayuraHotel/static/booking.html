<h3>Book your space</h3>
<br>
<form action="booking" method="post">
    <div class="mb-3">
        <label for="gname" class="form-label">Guest name</label>
        <input type="text" class="form-control" id="gname" name="gname">
    </div>

    <div class="mb-3">
        <label for="cidate" class="form-label">Check in date</label>
        <input type="date" class="form-control" id="cidate" name="cidate">
    </div>

    <div class="mb-3">
        <label for="codate" class="form-label">Check out date</label>
        <input type="date" class="form-control" id="codate" name="codate">
    </div>

    <div class="mb-3">
        <label for="room" class="form-label">Room Type</label>
        <select class="form-select" id="room" name="room">
            <option value="">Select Room Type</option>
            <option value="Deluxe">Deluxe</option>
            <option value="Extra Deluxe">Extra Deluxe</option>
            <option value="Couple Friendly">Couple Friendly</option>
            <option value="Brotherhood">Brotherhood</option>
            <option value="Family">Family</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="guestno" class="form-label">No of Guests</label>
        <input type="number" class="form-control" placeholder="Eg.2" id="guestno" name="guestno">
    </div>

<!--    <div class="mb-3">-->
<!--        <label for="amount" class="form-label">Total amount</label>-->
<!--        <input type="number" class="form-control" id="amount" name="amount">-->
<!--    </div>-->

    <button type="submit" class="btn btn-primary">Book now</button>
</form>
