<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Menu</title>
</head>

<body>
<h1>Select Your Food items to Order</h1>
<form action="order" method="post">
    <div class="mb-3">
        <label for="orderFrom" class="form-label">Ordered By</label>
        <input type="text" class="form-control" id="orderFrom" name="orderFrom">
    </div>

    <div class="mb-3">
        <label for="item" class="form-label">Item name</label>
        <input type="text" class="form-control" id="item" name="item">
    </div>

    <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity" name="quantity">
    </div>

    <div class="mb-3">
    <label for="address" class="form-label">Enter your address</label>
    <textarea class="form-control form-control-lg" id="address" name="address" rows="6"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">place order</button>
</form>
<br>
<br>
<a href="index.html" class="btn btn-primary" role="button">-Home</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
