<h3>Place a food order</h3>
<br>
<form action="order" method="post">
    <div class="mb-3">
        <label for="orderFrom" class="form-label">Ordered By</label>
        <input type="text" class="form-control" id="orderFrom" placeholder="Enter your name" name="orderFrom">
    </div>

    <div class="mb-3">
        <label for="item" class="form-label">Item name</label>
        <input type="text" class="form-control" id="item" name="item">
    </div>

    <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity" name="quantity">
    </div>

    <div class="mb-3">
    <label for="address" class="form-label">Enter your address</label>
    <textarea class="form-control form-control-lg" placeholder="Eg, 123 Main St, City, State" id="address" name="address" rows="6"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">place order</button>
</form>
