<h3>Baa maga trip hog barona, swalpa nemdhi sigutte!!</h3>
<br>

<form action="trip" method="post">
    <div class="mb-3">

        <label for="destname" class="form-label">Destination Name</label>
        <input type="text" class="form-control" placeholder="Bengaluru bittu yavdhadru bere location helu!" id="destname" name="destname" required>

        <label for="trvldate" class="form-label">Travel Date</label>
        <input type="date" id="trvldate" class="form-control" placeholder="edhe year alli hogona maga, nodkond select madu!" name="trvldate" required>

        <label for="rtrndate" class="form-label">Return Date</label>
        <input type="date" class="form-control" id="rtrndate" placeholder="ankodiddhu time ge return agalla,irli enter madu!" name="rtrndate">

        <label for="nooftrvrs" class="form-label">No of Travelers</label>
        <input type="number" id="nooftrvrs" class="form-control" placeholder="est jana bartare decide madu!" name="nooftrvrs" required>

        <label for="budget" class="form-label">Budget</label>
        <input type="number" class="form-control" id="budget" placeholder="esht dhudd adhru karchagli nodkollona!"  name="budget">

        <label for="transportmode" class="form-label">Transport Mode</label>
        <input type="text" class="form-control" id="transportmode" placeholder="Henge hogodhu?"  name="transportmode">

        <br>

        <button type="submit" class="btn btn-primary">Jai Mahishmati</button>

    </div>

</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
