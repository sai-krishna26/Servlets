<h3>Register your event and avoid last minute hassles</h3>
<br>

<form action="eregister" method="post">
  <div class="mb-3">
    <label for="eventtype" class="form-label">Event Type</label>
    <select class="form-select" id="eventtype" name="eventtype" required>
      <option value="">Select Event Type</option>
      <option value="Wedding">Wedding</option>
      <option value="Birthday">Birthday</option>
      <option value="Reception">Reception</option>
      <option value="Social Gatherings">Social Gatherings</option>
      <option value="Corporate Events">Corporate Events</option>
      <option value="Sports Events">Sports Events</option>
      <option value="Others">Others</option>
    </select>

    <label for="orgname" class="form-label">Organizer Name</label>
    <input type="text" id="orgname" class="form-control" name="orgname" required>

    <label for="edate" class="form-label">Event Date</label>
    <input type="date" class="form-control" id="edate"  name="edate">

    <label for="venue" class="form-label">Venue</label>
    <input type="text" id="venue" class="form-control" name="venue" required>

    <label for="capacity" class="form-label">Capacity</label>
    <input type="number" class="form-control" id="capacity" placeholder="Enter expected public count"  name="capacity">

    <label for="fee" class="form-label">Registration Fee</label>
    <input type="number" class="form-control" id="fee" placeholder="Enter registration fee"  name="fee">

    <br>

    <button type="submit" class="btn btn-primary">Submit</button>

  </div>

</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
